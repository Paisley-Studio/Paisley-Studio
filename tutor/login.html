<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tutor Portal — Paisley Studio</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="icon" href="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" sizes="32x32" />
<style>
  :root{
    --brand:#55BFB3; --brand-deep:#245F5A; --brand-soft:#7BCBC2;
    --paper:#F1F9F7; --surface:#FFFFFF; --sage:#E5F2EF;
    --ink:#263331; --muted:#5A6E6A; --line:rgba(38,51,49,.12);
    --gold:#F5C842; --font:'Quicksand',sans-serif;
    --success:#2EB872; --error:#E74C3C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font); background:linear-gradient(160deg,var(--paper) 0%, var(--sage) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.2rem; color:var(--ink);
  }
  .card{
    width:100%; max-width:420px; background:var(--surface); border-radius:22px;
    box-shadow:0 30px 70px rgba(36,95,90,.14); border:1px solid var(--line); padding:2.6rem 2.2rem; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:-60px; right:-60px; width:170px; height:170px;
    background:radial-gradient(circle, var(--brand-soft) 0%, transparent 70%); opacity:.35; border-radius:50%;
  }
  .brand{display:flex; align-items:center; gap:.7rem; margin-bottom:1.8rem; position:relative;}
  .brand img{width:42px; height:42px; border-radius:10px; object-fit:cover;}
  .brand .word{font-weight:800; font-size:1.05rem; color:var(--brand-deep); line-height:1.2;}
  .brand .word span{display:block; font-size:.66rem; font-weight:600; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  h1{font-size:1.5rem; font-weight:800; color:var(--brand-deep); margin-bottom:.3rem;}
  p.sub{color:var(--muted); font-size:.88rem; margin-bottom:1.8rem; line-height:1.5;}
  .field{margin-bottom:1.1rem;}
  .field label{display:block; font-size:.76rem; font-weight:700; color:var(--brand-deep); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.03em;}
  .field input{
    width:100%; padding:.75rem .9rem; border:1.5px solid var(--line); border-radius:11px;
    font-family:var(--font); font-size:.92rem; color:var(--ink); background:var(--paper); transition:border-color .2s;
  }
  .field input:focus{outline:none; border-color:var(--brand);}
  .btn{
    width:100%; padding:.85rem 0; border:none; border-radius:12px; background:var(--brand-deep); color:#fff;
    font-family:var(--font); font-weight:800; font-size:.94rem; cursor:pointer; transition:background .2s;
    display:flex; align-items:center; justify-content:center; gap:.5rem; margin-top:.4rem; position:relative;
  }
  .btn:hover{background:var(--brand);}
  .btn:disabled{opacity:.6; cursor:not-allowed;}
  .btn.loading .btn-text{opacity:0;}
  .btn.loading::after{
    content:''; position:absolute; width:18px; height:18px; border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg{display:none; padding:.7rem .9rem; border-radius:10px; font-size:.82rem; margin-bottom:1.1rem; line-height:1.4;}
  .msg.show{display:block;}
  .msg.error{background:rgba(231,76,60,.08); color:#B8362A; border:1px solid rgba(231,76,60,.25);}
  .msg.success{background:rgba(46,184,114,.08); color:#1D8B57; border:1px solid rgba(46,184,114,.25);}
  .back-link{display:block; text-align:center; margin-top:1.4rem; font-size:.82rem; color:var(--muted); text-decoration:none;}
  .back-link:hover{color:var(--brand-deep);}
  .forgot{background:none; border:none; color:var(--muted); font-family:var(--font); font-size:.78rem; cursor:pointer; margin-top:.9rem; width:100%; text-align:center;}
  .forgot:hover{color:var(--brand-deep);}
  .pending-note{
    background:var(--sage); border-radius:12px; padding:1rem 1.1rem; font-size:.8rem; color:var(--muted);
    line-height:1.5; margin-bottom:1.2rem; display:flex; gap:.6rem;
  }
  .pending-note i{color:var(--brand-deep); margin-top:.1rem;}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" alt="" />
    <div class="word">Paisley Studio<span>Tutor Portal</span></div>
  </div>

  <h1 id="titleText">Welcome back</h1>
  <p class="sub" id="subText">Sign in to manage your students, homework and classes.</p>

  <div class="pending-note" id="tutorNote" style="display:none;"></div>

  <div class="msg error" id="errMsg"></div>
  <div class="msg success" id="okMsg"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@paisleystudio.online" autocomplete="username" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
  </div>
  <button class="btn" id="loginBtn" type="button"><span class="btn-text"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</span></button>
  <button class="forgot" id="forgotBtn" type="button"><i class="fas fa-key"></i> Forgot your password?</button>

  <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to paisleystudio.online</a>
</div>

<script src="../js/ui/paisley-ui.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../lms-helpers.js"></script>
<script>
const auth = firebase.auth();

/* =========================================================
   The slug arrives one of two ways:
     /tutor/jane-wanjiru          (Firebase Hosting rewrite)
     /tutor/login.html?slug=jane-wanjiru
   Either way we resolve it to a tutorAccounts record and pin the
   sign-in to that tutor.
========================================================= */
function readSlug(){
  const q = new URLSearchParams(location.search).get('slug');
  if(q) return q.trim().toLowerCase();
  const parts = location.pathname.split('/').filter(Boolean);
  const last = parts[parts.length - 1] || '';
  if(!last || /\.html?$/i.test(last)) return '';
  return decodeURIComponent(last).trim().toLowerCase();
}

const slug = readSlug();
let tutorDoc = null;

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hideMsgs(){
  document.getElementById('errMsg').classList.remove('show');
  document.getElementById('okMsg').classList.remove('show');
}
function showErr(msg){ hideMsgs(); const e=document.getElementById('errMsg'); e.textContent=msg; e.classList.add('show'); }
function showOk(msg){ hideMsgs(); const o=document.getElementById('okMsg'); o.textContent=msg; o.classList.add('show'); }
function setLoading(btn, on){ btn.disabled = on; btn.classList.toggle('loading', on); }

if(slug){
  getTutorBySlug(slug).then(snap=>{
    if(!snap || snap.empty){
      showErr('That tutor link is not recognised. Check the URL with the Studio Desk.');
      return;
    }
    const d = snap.docs[0];
    tutorDoc = { id: d.id, ...d.data() };
    const note = document.getElementById('tutorNote');
    if(tutorDoc.status === 'Suspended'){
      showErr('This tutor account is suspended. Please contact the Studio Desk.');
      document.getElementById('loginBtn').disabled = true;
      return;
    }
    document.getElementById('titleText').textContent = 'Welcome back, ' + (tutorDoc.name || 'tutor').split(' ')[0];
    note.innerHTML = '<i class="fas fa-chalkboard-user"></i><div>Signing in as <strong>' + escapeHtml(tutorDoc.name||'') + '</strong>. Not you? Check your login link with the Studio Desk Admin.</div>';
    note.style.display = 'flex';
    if(tutorDoc.email) document.getElementById('loginEmail').value = tutorDoc.email;
  }).catch(err=>{
    console.error('Tutor lookup failed:', err);
    showErr('Could not load this tutor link. Please try again.');
  });
}

// Already signed in? Go straight through.
auth.onAuthStateChanged(user=>{
  if(!user) return;
  getTutorAccount(user.uid).then(doc=>{
    if(doc.exists && doc.data().status !== 'Suspended'){
      window.location.href = 'index.html';
    }
  }).catch(()=>{});
});

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if(!email || !pass){ showErr('Please enter your email and password.'); return; }

  const btn = document.getElementById('loginBtn');
  setLoading(btn, true);

  auth.signInWithEmailAndPassword(email, pass)
    .then(cred=> getTutorAccount(cred.user.uid))
    .then(doc=>{
      if(!doc.exists){
        return auth.signOut().then(()=>{ throw new Error('This account is not a tutor account. Students sign in at the student portal.'); });
      }
      const data = doc.data();
      if(data.status === 'Suspended'){
        return auth.signOut().then(()=>{ throw new Error('This tutor account is suspended. Please contact the Studio Desk.'); });
      }
      // If the URL named a tutor, the signed-in account must be that tutor.
      if(slug && tutorDoc && doc.id !== tutorDoc.id){
        return auth.signOut().then(()=>{ throw new Error('Those details do not match this tutor link. Use your own login URL.'); });
      }
      window.location.href = 'index.html';
    })
    .catch(err=>{
      setLoading(btn, false);
      let m = err.message || 'Incorrect email or password.';
      if(err.code === 'auth/user-not-found') m = 'No tutor account found with that email.';
      else if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') m = 'Incorrect email or password.';
      else if(err.code === 'auth/too-many-requests') m = 'Too many attempts. Please wait a few minutes.';
      showErr(m);
    });
});

document.getElementById('forgotBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ showErr('Enter your email address first, then press Forgot your password.'); return; }
  auth.sendPasswordResetEmail(email, { url: window.location.origin + '/tutor/login.html' })
    .then(()=>showOk('Password reset email sent to ' + email + '.'))
    .catch(err=>showErr('Could not send the reset email: ' + err.message));
});

document.querySelectorAll('input').forEach(inp=>{
  inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') document.getElementById('loginBtn').click(); });
});

/* ---------------------------------------------------------
   SEAMLESS PASSWORD RESET HANDLER
   Catches the link from the new emails, prompts for password,
   logs them in, and routes to the dashboard.
--------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const mode = urlParams.get('mode');
  const oobCode = urlParams.get('oobCode');

  if (mode === 'resetPassword' && oobCode) {
    let email = "";
    try {
      email = await auth.verifyPasswordResetCode(oobCode);
    } catch (err) {
      showErr("This password reset link is invalid or has expired. Please request a new one.");
      window.history.replaceState({}, document.title, "/tutor/login.html");
      return;
    }

    const newPassword = await PaisleyUI.prompt(`Please set a password for ${email}.\n(Must be at least 6 characters)`, { title:'Welcome to Paisley Studio!', password:true, placeholder:'New password', confirmLabel:'Set password' });

    if (!newPassword || newPassword.length < 6) {
      showErr("Password must be at least 6 characters. Please click the link in your email again.");
      return;
    }

    try {
      await auth.confirmPasswordReset(oobCode, newPassword);
      const cred = await auth.signInWithEmailAndPassword(email, newPassword);
      
      window.history.replaceState({}, document.title, "/tutor/login.html");
      
      showOk("Password set successfully! Taking you to your dashboard...");
      
      setTimeout(() => {
        window.location.href = '/tutor/index.html';
      }, 1200);

    } catch (err) {
      showErr("Error setting password: " + err.message);
    }
  }
});
</script>
</body>
</html>
