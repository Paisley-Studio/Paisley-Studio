<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity Analytics — Paisley Studio</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="icon" href="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" sizes="32x32" />
<style>
  :root{ --brand:#55BFB3; --brand-deep:#245F5A; --paper:#F1F9F7; --surface:#FFFFFF; --ink:#263331; --muted:#5A6E6A; --line:rgba(38,51,49,.10); --font:'Quicksand',sans-serif; }
  *{box-sizing:border-box;} body{margin:0; font-family:var(--font); background:var(--paper); color:var(--ink);}
  .topbar{display:flex; align-items:center; padding:1rem 1.6rem; background:var(--surface); border-bottom:1px solid var(--line);}
  .topbar a{color:var(--brand-deep); text-decoration:none; font-weight:700; font-size:.85rem;}
  .wrap{max-width:960px; margin:0 auto; padding:1.6rem 1rem 4rem;}
  h2{color:var(--brand-deep);}
  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8rem; margin-bottom:1.6rem;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1rem; text-align:center;}
  .stat strong{display:block; font-size:1.5rem; color:var(--brand-deep);}
  .stat span{font-size:.72rem; color:var(--muted);}
  table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:12px; overflow:hidden;}
  th,td{padding:.6rem .8rem; text-align:left; font-size:.82rem; border-bottom:1px solid var(--line);}
  th{background:#f8f9fc; color:var(--muted); font-size:.72rem; text-transform:uppercase;}
  .qrow.weak{background:#fef2f2;} .qrow.strong{background:#ecfdf3;}
</style>
</head>
<body>

<div class="topbar"><a href="manage.html"><i class="fas fa-arrow-left"></i> Back to Activities</a></div>

<div class="wrap">
  <h2 id="actTitle">Loading…</h2>
  <div class="statgrid" id="statGrid"></div>
  <h3>Question accuracy</h3>
  <table>
    <thead><tr><th>Question</th><th>Attempts</th><th>Correct %</th></tr></thead>
    <tbody id="qTable"></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../lms-helpers.js?v=boards3"></script>

<script>
const auth = firebase.auth();
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const activityId = new URLSearchParams(location.search).get('id');

auth.onAuthStateChanged(user => {
  if (!user || !activityId) { window.location.href = 'manage.html'; return; }
  Promise.all([getActivity(activityId), getAttemptsForActivity(activityId)]).then(([actDoc, attemptsSnap]) => {
    if (!actDoc.exists) { document.getElementById('actTitle').textContent = 'Activity not found.'; return; }
    const activity = actDoc.data();
    const attempts = attemptsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(activity, attempts);
  });
});

function render(activity, attempts) {
  document.getElementById('actTitle').textContent = activity.title || 'Untitled activity';
  const completed = attempts.filter(a => a.status === 'Completed');
  const avgScore = completed.length ? (completed.reduce((s, a) => s + (a.score || 0), 0) / completed.length) : 0;
  const avgMax = completed.length ? (completed.reduce((s, a) => s + (a.maxScore || 0), 0) / completed.length) : 0;
  const avgPct = avgMax ? Math.round((avgScore / avgMax) * 100) : 0;
  const highest = completed.reduce((m, a) => Math.max(m, a.maxScore ? Math.round((a.score/a.maxScore)*100) : 0), 0);
  const avgTime = completed.length ? Math.round(completed.reduce((s, a) => s + (a.elapsedSeconds || 0), 0) / completed.length) : 0;
  const completionRate = attempts.length ? Math.round((completed.length / attempts.length) * 100) : 0;

  document.getElementById('statGrid').innerHTML = `
    <div class="stat"><strong>${attempts.length}</strong><span>Total attempts</span></div>
    <div class="stat"><strong>${completed.length}</strong><span>Completed</span></div>
    <div class="stat"><strong>${completionRate}%</strong><span>Completion rate</span></div>
    <div class="stat"><strong>${avgPct}%</strong><span>Average score</span></div>
    <div class="stat"><strong>${highest}%</strong><span>Highest score</span></div>
    <div class="stat"><strong>${Math.floor(avgTime/60)}m ${avgTime%60}s</strong><span>Average time</span></div>`;

  const qStats = (activity.questions || []).map(q => {
    let attemptsCount = 0, correctCount = 0;
    completed.forEach(a => {
      const given = a.answers ? a.answers[q.id] : undefined;
      if (given === undefined) return;
      attemptsCount++;
      if (isCorrectLite(q, given)) correctCount++;
    });
    const pct = attemptsCount ? Math.round((correctCount / attemptsCount) * 100) : null;
    return { text: q.text, attemptsCount, pct };
  });

  document.getElementById('qTable').innerHTML = qStats.map(q => `
    <tr class="qrow ${q.pct !== null && q.pct < 50 ? 'weak' : ''} ${q.pct !== null && q.pct >= 85 ? 'strong' : ''}">
      <td>${escapeHtml(q.text || '(no text)')}</td>
      <td>${q.attemptsCount}</td>
      <td>${q.pct === null ? '—' : q.pct + '%'}</td>
    </tr>`).join('') || '<tr><td colspan="3">No questions.</td></tr>';
}

// Minimal standalone scoring check (mirrors activity-scoring.js's isCorrect,
// duplicated here in miniature so this analytics page doesn't need the
// whole engine bundle loaded just to compute accuracy percentages).
function isCorrectLite(question, answer) {
  const correct = question.correctOptionIds || [];
  if (question.groupId) return String(answer) === String(question.groupId);
  if (!question.options || !question.options.length) {
    const target = String(question.text || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const given = String(answer || '').trim().toLowerCase().replace(/\s+/g, ' ');
    return target.length > 0 && target === given;
  }
  if (Array.isArray(answer)) {
    if (answer.length !== correct.length) return false;
    const a = [...answer].sort(), b = [...correct].sort();
    return a.every((v, i) => v === b[i]);
  }
  return correct.includes(answer);
}
</script>

</body>
</html>
