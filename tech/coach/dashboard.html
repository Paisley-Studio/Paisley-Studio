<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Coach | Paisley TECH</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#245F5A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="icon" href="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" sizes="32x32" />
<link rel="stylesheet" href="/js/tech/tech-portal.css?v=tech7" />
</head>
<body>
<div id="gate"><div class="spin" role="status" aria-label="Loading"></div><p>Opening the coach portal…</p></div>

<div id="shell" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Coach navigation">
    <div class="sidebar-brand">
      <img src="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" width="38" height="38" alt="" />
      <div class="name">Paisley<span>TECH coach</span></div>
    </div>
    <nav class="sidebar-nav" id="nav">
      <button class="nav on" data-v="home" type="button"><i class="fas fa-house"></i> Overview</button>
      <button class="nav" data-v="builders" type="button"><i class="fas fa-people-group"></i> Builders</button>
      <button class="nav" data-v="reviews" type="button"><i class="fas fa-clipboard-check"></i> Reviews <span class="badge" id="bReviews" hidden>0</span></button>
      <button class="nav" data-v="work" type="button"><i class="fas fa-hammer"></i> Student work</button>
      <button class="nav" data-v="content" type="button"><i class="fas fa-bullseye"></i> Missions &amp; materials</button>
      <button class="nav" data-v="live" type="button"><i class="fas fa-video"></i> Live classes</button>
      <button class="nav" data-v="activity" type="button"><i class="fas fa-wave-square"></i> Activity</button>
      <button class="nav" data-v="practice" type="button"><i class="fas fa-flask"></i> Practice <span class="badge" id="bHelp" hidden>0</span></button>
      <button class="nav" data-v="messages" type="button"><i class="fas fa-comments"></i> Builder messages</button>
      <button class="nav" data-v="families" type="button"><i class="fas fa-user-shield"></i> Families</button>
      <button class="nav" data-v="profile" type="button"><i class="fas fa-user"></i> Profile</button>
    </nav>
    <div class="sidebar-foot">
      <div class="me"><span class="avatar" id="avatar" aria-hidden="true"></span><div class="who"><b id="whoName"></b><span>TECH coach</span></div></div>
      <button class="signout" id="signOut" type="button"><i class="fas fa-right-from-bracket"></i> Sign out</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuBtn" type="button" aria-label="Open menu"><i class="fas fa-bars"></i></button>
      <div class="titles"><h1 id="pageTitle">Overview</h1><p id="pageSub"></p></div>
      <div id="bellHost"></div>
    </header>
    <main class="content" id="view" aria-live="polite"></main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/tech/writing-studio.js?v=tech7"></script>
<script src="/js/tech/code-lab.js?v=tech7"></script>
<script src="/js/tech/upload-pad.js?v=tech7"></script>
<script src="/js/tech/tech-helpers.js?v=tech8"></script>
<script src="/js/tech/tech-manage.js?v=tech7"></script>
<script src="/js/tech/coach-access.js?v=tech6"></script>
<script>
/* Paisley TECH coach portal.
   A coach is techCoaches/{uid} (status Active). Builders are techStudents with
   coachId == uid; builds, chats and family chats carry the same coachId. */
(function(){
'use strict';
const auth=firebase.auth(), T=TechUI, esc=T.esc, FV=()=>firebase.firestore.FieldValue;
const $=id=>document.getElementById(id);
T.injectStyle();

const S={uid:null,me:null,v:'home',students:[],builds:[],chats:[],gchats:[],content:[],allContent:[],classes:[],help:[],progress:{},
  builder:null,live:null,back:null,rf:'all',wf:'all',unsubs:[]};
const TITLES={home:'Overview',builders:'Builders',reviews:'Reviews',work:'Student work',content:'Missions & materials',live:'Live classes',activity:'Activity',practice:'Practice',messages:'Builder messages',families:'Families',profile:'Profile'};
const KINDS=[['topic','Topic'],['resource','Resource'],['aiTool','AI tool']];

const ms=x=>{ const d=T.toDate(x); return d?d.getTime():0; };
const cap=s=>{ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); };
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w.charAt(0).toUpperCase()).join('');
const dateShort=ts=>{ const d=T.toDate(ts); return d?d.toLocaleDateString([],{day:'numeric',month:'short'}):''; };
const active=()=>S.students.filter(s=>s.status==='Active');
const stu=id=>S.students.find(s=>s.id===id);
const needs=b=>b.reviewState==='requested'||b.reviewState==='reviewing'||b.showcase==='requested'||b.mastery==='requested';
const mine=()=>({uid:S.uid,role:'coach',name:S.me.name||''});
const missionOf=id=>S.allContent.find(c=>c.id===id)||null;
const levelOf=sid=>{ const p=S.progress[sid]; let m=1; if(p&&p.levels) T.DISCIPLINES.forEach(d=>{ m=Math.max(m,p.levels[d]||1); }); return m; };
function label(b){
  if(b.reviewState==='requested') return [(Number(b.submissionCount)||0)>1?'Resubmitted':'Submitted','warn'];
  if(b.reviewState==='reviewing') return ['Under review','warn'];
  if(b.showcase==='requested') return ['Publish requested','warn'];
  if(b.mastery==='requested') return ['Mastery requested','warn'];
  if(b.reviewState==='requested') return ['Review requested','warn'];
  if(b.reviewState==='changes'||b.mastery==='changes') return ['Waiting for changes','bad'];
  if(b.showcase==='approved') return ['Published','gold'];
  if(b.reviewState==='approved') return ['Approved','ok'];
  if(b.mastery==='approved') return ['Mastered','ok'];
  return [T.STATUS_LABEL[b.status]||b.status||'Idea',''];
}
function gate(title,body,btn){ $('shell').hidden=true; $('gate').hidden=false; $('gate').innerHTML='<div class="gate-card"><h1>'+title+'</h1><p>'+body+'</p>'+(btn||'')+'</div>'; }
function leave(){ const to='/tech/coach/'+(S.me&&S.me.slug?encodeURIComponent(S.me.slug):'index.html'); auth.signOut().finally(()=>{ location.href=to; }); }
document.addEventListener('click',e=>{ if(e.target.closest('#gSign')) leave(); });

auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='/tech/coach/index.html'; return; }
  S.uid=user.uid;
  let r; try{ r=await TechCoachAccess.resolve(user); }catch(e){ return gate('Could not open the coach portal',esc(T.errMsg(e))); }
  if(r.state==='paused') return gate('Coach account paused','Please contact the Studio Desk.','<button class="btn" id="gSign" type="button">Sign out</button>');
  if(r.state!=='active') return gate('Not a coach account','There is no TECH coach account for '+esc(user.email||'this login')+'. Ask the Studio Desk to add you on the Tutors page with exactly this email.','<button class="btn" id="gSign" type="button">Sign out</button>');
  S.me=r.coach;
  boot();
});

function listen(q,key,after){
  S.unsubs.push(q.onSnapshot(s=>{ S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data())); if(after) after(); refresh(); },e=>console.warn('coach '+key,e)));
}
function boot(){
  $('gate').hidden=true; $('shell').hidden=false;
  $('avatar').textContent=initials(S.me.name); $('whoName').textContent=S.me.name||'Coach';
  db.collection('techCoaches').doc(S.uid).update({lastLoginAt:FV().serverTimestamp()}).catch(()=>{});
  T.mountBell($('bellHost'),{uid:S.uid,onOpen:n=>{
    if(n.chatId&&openChatById(n.chatId)) return true;
    if(n.buildId){ openBuild(n.buildId); return true; }
    if(n.studentId&&stu(n.studentId)){ openBuilder(n.studentId); return true; }
    return true;
  }});
  listen(db.collection('techStudents').where('coachId','==',S.uid),'students',()=>{
    S.students.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    S.students.forEach(s=>{ if(!(s.id in S.progress)){ S.progress[s.id]=null; db.collection('techProgress').doc(s.id).get().then(p=>{ S.progress[s.id]=p.exists?p.data():null; refresh(); }).catch(()=>{}); } });
  });
  listen(db.collection('techBuilds').where('coachId','==',S.uid),'builds',()=>S.builds.sort((a,b)=>ms(b.updatedAt)-ms(a.updatedAt)));
  listen(db.collection('techChats').where('coachId','==',S.uid),'chats');
  listen(db.collection('techGuardianChats').where('coachId','==',S.uid),'gchats');
  listen(db.collection('techContent'),'allContent',()=>{ S.allContent.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)); S.content=S.allContent.filter(c=>c.createdBy===S.uid); });
  listen(db.collection('techLiveClasses').where('coachId','==',S.uid),'classes',()=>{ S.classes=T.sortLive(S.classes); });
  const h=(location.hash||'').slice(1);
  go(TITLES[h]?h:'home');
}
function refresh(){
  const n=S.builds.filter(needs).length, b=$('bReviews'); b.hidden=!n; b.textContent=n;
  if(!S.live) render(true);
  /* Practice help requests: one listener per builder (the rules check the coach builder by builder). */
  const ids=active().map(s=>s.id).sort().join(',');
  if(ids!==S.helpIds){
    S.helpIds=ids; (S.helpUnsubs||[]).forEach(u=>u()); S.helpUnsubs=[]; S.help=[];
    active().forEach(s=>S.helpUnsubs.push(db.collection('techPractice').where('studentId','==',s.id).where('helpRequested','==',true).onSnapshot(q=>{
      S.help=S.help.filter(x=>x.studentId!==s.id).concat(q.docs.map(d=>Object.assign({id:d.id},d.data())));
      const h=$('bHelp'); h.hidden=!S.help.length; h.textContent=S.help.length; if(!S.live&&S.v==='home') render(true);
    },()=>{})));
  }
}

/* ---------- navigation ---------- */
function setNav(v){ document.querySelectorAll('.nav[data-v]').forEach(b=>{ const on=b.dataset.v===v; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); }
function kill(){ if(S.live){ S.live.destroy(); S.live=null; } }
function go(v){
  kill(); S.v=v; S.builder=null; S.back=null;
  setNav(v); $('sidebar').classList.remove('open'); $('scrim').classList.remove('open');
  try{ history.replaceState(null,'','#'+v); }catch(e){}
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('.nav[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
$('signOut').addEventListener('click',leave);
$('menuBtn').addEventListener('click',()=>{ $('sidebar').classList.add('open'); $('scrim').classList.add('open'); });
$('scrim').addEventListener('click',()=>{ $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); });

function head(title,sub){ $('pageTitle').textContent=title; $('pageSub').textContent=sub||''; }
function subFor(v){
  return ({home:'Hi '+T.firstName(S.me.name)+'. Here is what needs you.',builders:active().length+' active builder'+(active().length===1?'':'s'),
    reviews:'Submissions, resubmissions and publish requests from your builders.',work:'Every mission and self-led project your builders are working on.',
    messages:'Talk to your builders.',families:'Parents and guardians of your builders.',content:'Release missions with study materials, videos, practice and criteria.',
    live:'Schedule Google Meet classes for your builders.',activity:'What your builders are doing, and when they were last seen.',practice:'Practice work. Never graded; answer help requests here.',profile:S.me.email||''})[v]||'';
}

/* ---------- pieces ---------- */
function emptyBox(t,p,a){ return '<div class="empty"><h3>'+t+'</h3><p>'+p+'</p>'+(a||'')+'</div>'; }
function panelList(title,rows,extra){ return '<section class="panel flush"><div class="panel-head"><h2>'+esc(title)+'</h2>'+(extra||'')+'</div>'+rows+'</section>'; }
function buildRow(b,showWho){
  const l=label(b), d=dateShort(b.submittedAt&&b.reviewState==='requested'?b.submittedAt:b.updatedAt);
  return '<button class="row" type="button" data-open="'+esc(b.id)+'"><span class="ico"><i class="fas '+(T.isSelfLed(b)?'fa-lightbulb':'fa-bullseye')+'"></i></span><span class="t"><b>'+esc(b.title)+'</b><span>'+
    (showWho?esc(b.studentName||'')+' · ':'')+esc(T.isSelfLed(b)?'Self-led project':'Mission')+(d?' · '+esc(d):'')+'</span></span><span class="tags">'+T.originTag(b)+'<span class="pill '+l[1]+'">'+esc(l[0])+'</span>'+(b.gradeLabel?'<span class="pill gold">'+esc(b.gradeLabel)+'</span>':'')+'</span><i class="fas fa-chevron-right chev"></i></button>';
}
function kpi(i,cls,lab,val){ return '<div class="kpi-card"><div class="kpi-icon '+cls+'"><i class="fas '+i+'"></i></div><div><span class="kpi-label">'+lab+'</span><span class="kpi-value">'+val+'</span></div></div>'; }
function segs(L){ return '<ol class="segs" aria-label="Level '+L+' of 7">'+T.LEVELS.map((n,k)=>'<li class="'+((k+1)<L?'done':((k+1)===L?'now':''))+'"><span></span><b>'+esc(cap(n))+'</b></li>').join('')+'</ol>'; }
function familyRows(){
  const rows=[];
  active().forEach(s=>(s.guardianAccounts||[]).forEach(g=>{
    const c=S.gchats.find(x=>x.parentUid===g.parentUid&&x.studentId===s.id);
    rows.push({s,g,c,at:c?ms(c.lastAt):0});
  }));
  /* Families whose chat exists but who are no longer in guardianAccounts (rare) still show. */
  S.gchats.forEach(c=>{ if(!rows.some(r=>r.c===c)){ const s=stu(c.studentId)||{id:c.studentId,name:c.studentName}; rows.push({s,g:{parentUid:c.parentUid,name:c.parentName},c,at:ms(c.lastAt)}); } });
  return rows.sort((a,b)=>b.at-a.at);
}
function waiting(c){ return c&&c.lastSenderRole&&c.lastSenderRole!=='coach'&&c.lastSenderRole!=='admin'; }

/* ---------- views ---------- */
const VIEWS={
home(){
  const act=active(), rev=S.builds.filter(needs), mastered=S.builds.filter(b=>b.mastery==='approved').length;
  const unanswered=S.chats.filter(waiting).map(c=>({kind:'b',c})).concat(S.gchats.filter(waiting).map(c=>({kind:'g',c}))).sort((a,b)=>ms(b.c.lastAt)-ms(a.c.lastAt));
  const recent=S.builds.filter(b=>!needs(b)).slice(0,5);
  if(!S.students.length) return emptyBox('No builders yet','The Studio Desk pairs builders with you. They will appear here, with their projects and families.');
  const up=S.classes.filter(c=>/live|upcoming/.test(T.liveState(c))).slice(0,3);
  const self=S.builds.filter(b=>T.isSelfLed(b)).length;
  return '<div class="stack">'+(up.length?'<section class="stack" style="gap:.7rem">'+up.map(c=>T.liveCardHtml(c,{banner:true,manage:true})).join('')+'</section>':'')+
    '<div class="kpi-grid">'+kpi('fa-people-group','ki-1','Builders',act.length)+kpi('fa-clipboard-check','ki-2','Waiting for you',rev.length)+kpi('fa-hammer','ki-1','Projects',S.builds.length)+kpi('fa-lightbulb','ki-2','Self-led',self)+kpi('fa-award','ki-4','Mastered',mastered)+'</div>'+
    (rev.length?panelList('Waiting for your review',rev.slice(0,8).map(b=>buildRow(b,true)).join(''),rev.length>8?'<button class="link" type="button" data-go="reviews">All reviews</button>':''):'')+
    (S.help.length?panelList('Asked for help with practice',S.help.map(p=>'<button class="row" type="button" data-go="practice"><span class="ico"><i class="fas fa-hand"></i></span><span class="t"><b>'+esc(p.title||'Practice')+'</b><span>'+esc(p.studentName||'')+' · '+esc(T.ago(p.updatedAt))+'</span></span><i class="fas fa-chevron-right chev"></i></button>').join('')):'')+
    (unanswered.length?panelList('Messages waiting for a reply',unanswered.slice(0,6).map(x=>x.kind==='b'
      ?'<button class="row" type="button" data-chatid="'+esc(x.c.id)+'"><span class="ico av">'+esc(initials(x.c.studentName))+'</span><span class="t"><b>'+esc(x.c.studentName||'Builder')+'</b><span>'+esc(x.c.lastMessage||'')+'</span></span><span class="tags"><span class="pill">Builder</span></span><i class="fas fa-chevron-right chev"></i></button>'
      :'<button class="row" type="button" data-chatid="'+esc(x.c.id)+'"><span class="ico"><i class="fas fa-user-shield"></i></span><span class="t"><b>'+esc(x.c.parentName||'Guardian')+'</b><span>'+esc(x.c.lastMessage||'')+'</span></span><span class="tags"><span class="pill gold">Family of '+esc(T.firstName(x.c.studentName))+'</span></span><i class="fas fa-chevron-right chev"></i></button>').join('')):'')+
    (recent.length?panelList('Recently updated',recent.map(b=>buildRow(b,true)).join('')):'')+
  '</div>';
},
builders(){
  if(S.builder){ const s=stu(S.builder); if(s) return builderDetail(s); }
  if(!S.students.length) return emptyBox('No builders yet','The Studio Desk pairs builders with you.');
  return panelList('Your builders',S.students.map(s=>{
    const bs=S.builds.filter(b=>b.studentId===s.id), n=bs.filter(needs).length, L=levelOf(s.id);
    return '<button class="row" type="button" data-builder="'+esc(s.id)+'"><span class="ico av">'+esc(initials(s.name))+'</span><span class="t"><b>'+esc(s.name)+'</b><span>'+
      bs.length+' project'+(bs.length===1?'':'s')+' · '+esc(cap(T.levelName(L)))+' (level '+L+')'+((s.guardianAccounts||[]).length?' · '+(s.guardianAccounts.length)+' guardian'+(s.guardianAccounts.length===1?'':'s'):'')+'</span></span><span class="tags">'+
      (s.status!=='Active'?'<span class="pill bad">'+esc(s.status||'Pending')+'</span>':'')+(n?'<span class="pill warn">'+n+' waiting</span>':'')+'</span><i class="fas fa-chevron-right chev"></i></button>';
  }).join(''));
},
reviews(){
  const F={all:needs,review:b=>b.reviewState==='requested'&&(Number(b.submissionCount)||0)<=1,resub:b=>b.reviewState==='requested'&&(Number(b.submissionCount)||0)>1,reviewing:b=>b.reviewState==='reviewing',self:b=>needs(b)&&T.isSelfLed(b),showcase:b=>b.showcase==='requested',changes:b=>b.reviewState==='changes'||b.mastery==='changes'};
  const LAB={all:'Waiting for you',review:'New submissions',resub:'Resubmissions',reviewing:'Under review',self:'Self-led',showcase:'Publish requests',changes:'Waiting for revision'};
  const list=S.builds.filter(F[S.rf]||needs);
  return '<div class="chips" role="group" aria-label="Filter">'+Object.keys(LAB).map(k=>'<button class="chip'+(S.rf===k?' on':'')+'" type="button" aria-pressed="'+(S.rf===k)+'" data-rf="'+k+'">'+LAB[k]+'<em>'+S.builds.filter(F[k]).length+'</em></button>').join('')+'</div>'+
    (list.length?'<section class="panel flush">'+list.map(b=>buildRow(b,true)).join('')+'</section>':emptyBox('Nothing here','You are all caught up.'));
},
messages(){
  const act=active();
  if(!act.length) return emptyBox('No builders to message yet','Messages appear once builders are paired with you.');
  const rows=act.map(s=>({s,c:S.chats.find(c=>c.studentId===s.id)})).sort((a,b)=>ms(b.c&&b.c.lastAt)-ms(a.c&&a.c.lastAt));
  return '<section class="panel flush">'+rows.map(r=>'<button class="row" type="button" data-chatb="'+esc(r.s.id)+'"><span class="ico av">'+esc(initials(r.s.name))+'</span><span class="t"><b>'+esc(r.s.name)+'</b><span>'+esc(r.c&&r.c.lastMessage||'No messages yet')+'</span></span><span class="tags">'+(waiting(r.c)?'<span class="pill warn">Reply</span>':'')+(r.c?'<span class="pill">'+esc(dateShort(r.c.lastAt))+'</span>':'')+'</span><i class="fas fa-chevron-right chev"></i></button>').join('')+'</section>';
},
families(){
  const rows=familyRows();
  if(!rows.length) return emptyBox('No families linked yet','When a builder\'s parent or guardian is linked, you can message them here. They can also message you.');
  return '<p class="muted" style="margin:-.4rem 0 1rem">Parents and guardians see their child\'s projects, coach feedback and progress. Keep messages about the learning.</p>'+
    '<section class="panel flush">'+rows.map(r=>'<button class="row" type="button" data-chatg="'+esc(r.g.parentUid)+'|'+esc(r.s.id)+'"><span class="ico"><i class="fas fa-user-shield"></i></span><span class="t"><b>'+esc(r.g.name||'Guardian')+'</b><span>Family of '+esc(r.s.name||'')+' · '+esc(r.c&&r.c.lastMessage||'No messages yet')+'</span></span><span class="tags">'+(waiting(r.c)?'<span class="pill warn">Reply</span>':'')+'</span><i class="fas fa-chevron-right chev"></i></button>').join('')+'</section>';
},
work(){
  const F={all:()=>true,mission:b=>!T.isSelfLed(b),self:b=>T.isSelfLed(b),progress:b=>T.projectState(b)==='in_progress',approved:b=>['approved','mastered'].includes(T.projectState(b)),published:b=>b.showcase==='approved'};
  const LAB={all:'All',mission:'Missions',self:'Self-led',progress:'In progress (not submitted)',approved:'Approved',published:'Published'};
  const list=S.builds.filter(F[S.wf]||F.all);
  return '<div class="chips" role="group" aria-label="Filter">'+Object.keys(LAB).map(k=>'<button class="chip'+(S.wf===k?' on':'')+'" type="button" aria-pressed="'+(S.wf===k)+'" data-wf="'+k+'">'+LAB[k]+'<em>'+S.builds.filter(F[k]).length+'</em></button>').join('')+'</div>'+
    (list.length?'<section class="panel flush">'+list.map(b=>buildRow(b,true)).join('')+'</section>':emptyBox('Nothing here','No projects match this filter.'));
},
live(){
  return '<div class="stack"><div><button class="btn" type="button" data-newlive><i class="fas fa-plus"></i> Schedule a live class</button></div>'+
    (S.classes.length?'<section class="stack" style="gap:.7rem">'+S.classes.map(c=>T.liveCardHtml(c,{manage:true})+(c.audience==='selected'?'<p class="muted" style="font-size:.78rem;margin:-.4rem 0 0 .4rem">For '+esc((c.studentIds||[]).map(id=>(stu(id)||{}).name||'a builder').join(', '))+'</p>':'')).join('')+'</section>'
      :emptyBox('No live classes yet','Schedule one with its topic, time and Google Meet link. Your builders, their families and the Studio Desk are notified.'))+'</div>';
},
content(){
  const ms=S.allContent.filter(c=>c.kind==='mission'||c.kind==='challenge');
  const own=ms.filter(c=>c.createdBy===S.uid), others=ms.filter(c=>c.createdBy!==S.uid&&c.status==='published');
  const mrow=c=>'<div class="row"><span class="ico"><i class="fas fa-bullseye"></i></span><span class="t"><b>'+esc(c.title)+'</b><span>'+esc(c.kind==='challenge'?'Challenge':'Mission')+(c.level?' · '+esc(cap(T.levelName(c.level))):'')+((c.materials||[]).length?' · '+c.materials.length+' material'+(c.materials.length===1?'':'s'):'')+((c.materials||[]).some(x=>x.type==='video')?' incl. video':'')+' · '+S.builds.filter(b=>b.missionId===c.id).length+' started</span></span><span class="tags"><span class="pill '+(c.status==='published'?'ok':'')+'">'+(c.status==='published'?'Released':'Draft')+'</span>'+(c.createdBy===S.uid?'<button class="btn light sm" type="button" data-editm="'+esc(c.id)+'">Edit</button>':'')+'</span></div>';
  return '<div class="stack"><section class="panel"><div class="panel-head"><h2>Missions</h2><button class="btn" type="button" data-newm><i class="fas fa-plus"></i> New mission</button></div><p class="muted" style="margin:-.6rem 0 1rem">Each mission carries what builders learn, the study materials and videos, practice, the task, what to submit and how you will assess it. Release it to your builders when it is ready.</p>'+
      (own.length?own.map(mrow).join(''):'<p class="muted">You have not written a mission yet.</p>')+'</section>'+
    (others.length?panelList('Released by the Studio Desk and other coaches',others.map(mrow).join('')):'')+
    '<section class="panel"><div class="panel-head"><h2>Topics, resources and AI tools</h2></div><p class="muted" style="margin:-.6rem 0 1rem">Short items without a task. Save as a draft, or publish so builders can see them.</p>'+
    '<div class="row2"><div class="field"><label for="ccK">Type</label><select id="ccK">'+KINDS.map(k=>'<option value="'+k[0]+'">'+k[1]+'</option>').join('')+'</select></div>'+
    '<div class="field"><label for="ccL">Level (optional)</label><select id="ccL"><option value="">Any</option>'+T.LEVELS.map((n,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+esc(cap(n))+'</option>').join('')+'</select></div></div>'+
    '<div class="field"><label for="ccT">Title</label><input id="ccT" maxlength="120"></div><div class="field"><label for="ccS">One-line summary</label><input id="ccS" maxlength="300"></div>'+
    '<div class="field"><label for="ccB">Details</label><textarea id="ccB" maxlength="8000"></textarea></div><div class="field"><label for="ccU">Link (optional)</label><input id="ccU" placeholder="https://"></div>'+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn light" type="button" data-cc="draft">Save draft</button><button class="btn" type="button" data-cc="published">Publish</button></div><div class="msg" id="ccM" role="status"></div></section>'+
    (S.content.filter(c=>c.kind!=='mission'&&c.kind!=='challenge').length?panelList('Your other content',S.content.filter(c=>c.kind!=='mission'&&c.kind!=='challenge').map(c=>'<div class="row"><span class="ico"><i class="fas fa-bullseye"></i></span><span class="t"><b>'+esc(c.title)+'</b><span>'+esc((KINDS.find(k=>k[0]===c.kind)||[0,c.kind])[1])+(c.level?' · level '+c.level:'')+'</span></span><span class="tags"><span class="pill '+(c.status==='published'?'ok':'')+'">'+(c.status==='published'?'Published':'Draft')+'</span><button class="btn light sm" type="button" data-pub="'+esc(c.id)+'" data-to="'+(c.status==='published'?'draft':'published')+'">'+(c.status==='published'?'Unpublish':'Publish')+'</button></span></div>').join('')):'')+
  '</div>';
},
profile(){
  const m=S.me;
  return '<div class="stack" style="max-width:640px"><section class="panel"><div class="panel-head"><h2>'+esc(m.name||'')+'</h2></div>'+
    '<div class="field"><label for="pEm">Email</label><input id="pEm" value="'+esc(m.email||'')+'" readonly></div>'+
    '<div class="field"><label for="pPh">Phone</label><input id="pPh" type="tel" maxlength="40" value="'+esc(m.phone||'')+'"></div>'+
    '<div class="field"><label for="pBio">About you</label><textarea id="pBio" maxlength="600">'+esc(m.bio||'')+'</textarea></div>'+
    ((m.disciplines||[]).length?'<div class="field"><span class="lbl">Disciplines</span><div class="pills">'+m.disciplines.map(d=>'<span class="pill">'+esc(d)+'</span>').join('')+'</div></div>':'')+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" type="button" id="pSave">Save</button><button class="btn light" type="button" id="pPw">Email me a password reset</button></div><div class="msg" id="pMsg" role="status"></div></section></div>';
}
};

function builderDetail(s){
  const bs=S.builds.filter(b=>b.studentId===s.id), L=levelOf(s.id), p=S.progress[s.id];
  const fam=(s.guardianAccounts||[]);
  const disc=T.DISCIPLINES.map(d=>{ const l=(p&&p.levels&&p.levels[d])||1, n=(p&&p.masteryCount&&p.masteryCount[d])||0;
    return '<div class="drow"><span class="dn">'+esc(d)+'</span><div class="bar" aria-hidden="true"><i style="width:'+Math.round(l/7*100)+'%"></i></div><span class="dl">'+esc(cap(T.levelName(l)))+'</span><span class="dm">'+n+' mastered</span></div>'; }).join('');
  return '<button class="back" type="button" data-back><i class="fas fa-arrow-left"></i> Builders</button><div class="stack">'+
    '<section class="panel"><p class="muted" style="font-size:.8rem;margin:0 0 .4rem">Last seen '+esc(T.ago(T.lastSeen(s)))+'</p><div class="panel-head"><h2>'+esc(s.name)+'</h2><div class="pills"><span class="pill">'+esc(T.builderId(s.id))+'</span>'+(s.status!=='Active'?'<span class="pill bad">'+esc(s.status||'Pending')+'</span>':'')+((s.programmes||[]).length?'<span class="pill gold">Also: '+esc(s.programmes.join(', '))+'</span>':'')+'</div></div>'+
      '<p class="lvl-name">'+esc(cap(T.levelName(L)))+'<small>Level '+L+' of 7</small></p>'+segs(L)+
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">'+(s.status==='Active'?'<button class="btn" type="button" data-chatb="'+esc(s.id)+'"><i class="fas fa-comments"></i> Message '+esc(T.firstName(s.name))+'</button>':'')+
        fam.map(g=>'<button class="btn light" type="button" data-chatg="'+esc(g.parentUid)+'|'+esc(s.id)+'"><i class="fas fa-user-shield"></i> Message '+esc(g.name||'guardian')+'</button>').join('')+'</div>'+
      (fam.length?'':'<p class="muted" style="margin-top:.8rem;font-size:.85rem">No parent or guardian linked yet.</p>')+'</section>'+
    (bs.length?panelList('Projects',bs.map(b=>buildRow(b,false)).join('')):emptyBox('No projects yet',esc(T.firstName(s.name))+' has not started a project.'))+
    '<section class="panel flush"><div class="panel-head"><h2>Progress by discipline</h2></div>'+disc+'</section>'+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn light" type="button" data-actof="'+esc(s.id)+'"><i class="fas fa-wave-square"></i> Activity timeline</button><button class="btn light" type="button" data-pracof="'+esc(s.id)+'"><i class="fas fa-flask"></i> Practice work</button></div>'+
  '</div>';
}

function render(silent){
  if(S.live) return;
  head(TITLES[S.v]||'Overview', S.v==='builders'&&S.builder&&stu(S.builder)?'Builder':subFor(S.v));
  if(S.v==='activity'||S.v==='practice'){
    const fn=S.v==='activity'?TechManage.mountActivity:TechManage.mountPractice;
    $('view').innerHTML='<div id="liveHost"></div>'; S.back={v:S.v}; S.live=fn($('liveHost'),{me:mine(),students:S.students}); return;
  }
  $('view').innerHTML=(VIEWS[S.v]||VIEWS.home)();
  if(!silent) window.scrollTo(0,0);
}

/* ---------- opening things ---------- */
function mountLive(backLabel,mountFn){
  kill();
  const ret={v:S.v,builder:S.builder};
  $('view').innerHTML='<button class="back" type="button" data-back><i class="fas fa-arrow-left"></i> '+esc(backLabel)+'</button><div id="liveHost"></div>';
  S.back=ret; S.live=mountFn($('liveHost'));
  window.scrollTo(0,0);
}
function openBuild(id){
  const b=S.builds.find(x=>x.id===id);
  head(b?b.title:'Project',b?(b.studentName||''):'');
  mountLive(S.builder?'Back to builder':(TITLES[S.v]||'Back'),h=>T.mountWorkspace(h,{id,me:mine(),mission:b&&b.missionId?missionOf(b.missionId):null,findMission:missionOf,onDeleted:()=>{ kill(); render(); }}));
}
function openBuilder(sid){ kill(); S.v='builders'; S.builder=sid; setNav('builders'); render(); }
function openBuilderChat(sid){
  const s=stu(sid); if(!s) return;
  head('Message '+T.firstName(s.name),'Builder');
  mountLive('Back',h=>T.mountChat(h,{studentId:s.id,studentName:s.name,coachId:S.uid,coachName:S.me.name,me:{uid:S.uid,role:'coach',name:S.me.name}}));
}
function openFamilyChat(parentUid,sid){
  const s=stu(sid)||{id:sid,name:''};
  const g=(s.guardianAccounts||[]).find(x=>x.parentUid===parentUid)||{}, c=S.gchats.find(x=>x.parentUid===parentUid&&x.studentId===sid)||{};
  head(g.name||c.parentName||'Guardian','Family of '+(s.name||c.studentName||''));
  mountLive('Back',h=>T.mountChat(h,{kind:'guardian',parentUid,parentName:g.name||c.parentName||'',studentId:sid,studentName:s.name||c.studentName||'',coachId:S.uid,coachName:S.me.name,me:{uid:S.uid,role:'coach',name:S.me.name}}));
}
function openChatById(id){
  const c=S.chats.find(x=>x.id===id); if(c){ openBuilderChat(c.studentId); return true; }
  const g=S.gchats.find(x=>x.id===id); if(g){ openFamilyChat(g.parentUid,g.studentId); return true; }
  return false;
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-open],[data-builder],[data-chatb],[data-chatg],[data-chatid],[data-back],[data-go],[data-rf],[data-wf],[data-cc],[data-pub],[data-newm],[data-editm],[data-newlive],[data-editlive],[data-actof],[data-pracof],#pSave,#pPw'); if(!t||!S.me) return;
  if(t.closest('#liveHost')&&!t.matches('[data-back]')&&!t.matches('[data-editlive]')) return;   // workspaces and panels handle their own clicks
  if(t.dataset.newm!==undefined||t.dataset.editm){ TechManage.editMission({me:mine(),item:t.dataset.editm?missionOf(t.dataset.editm):null,students:S.students,aiTools:S.allContent.filter(c=>c.kind==='aiTool'&&c.status==='published'),missions:S.allContent}); return; }
  if(t.dataset.newlive!==undefined||t.dataset.editlive){ TechManage.editLive({me:mine(),item:t.dataset.editlive?S.classes.find(c=>c.id===t.dataset.editlive):null,students:S.students}); return; }
  if(t.dataset.actof||t.dataset.pracof){ const sid=t.dataset.actof||t.dataset.pracof, s=stu(sid); head((t.dataset.actof?'Activity · ':'Practice · ')+((s&&s.name)||''),'Last seen '+T.ago(T.lastSeen(s))); mountLive('Back to builder',h=>(t.dataset.actof?TechManage.mountActivity:TechManage.mountPractice)(h,{me:mine(),students:S.students,studentId:sid})); return; }
  if(t.dataset.wf){ S.wf=t.dataset.wf; render(true); return; }
  if(t.dataset.open) openBuild(t.dataset.open);
  else if(t.dataset.builder) openBuilder(t.dataset.builder);
  else if(t.dataset.chatb) openBuilderChat(t.dataset.chatb);
  else if(t.dataset.chatg){ const [p,s]=t.dataset.chatg.split('|'); openFamilyChat(p,s); }
  else if(t.dataset.chatid) openChatById(t.dataset.chatid);
  else if(t.dataset.back!==undefined){
    if(S.live){ const r=S.back||{v:S.v}; kill(); S.v=r.v; S.builder=r.builder||null; setNav(S.v); render(); }
    else { S.builder=null; render(); }
  }
  else if(t.dataset.go) go(t.dataset.go);
  else if(t.dataset.rf){ S.rf=t.dataset.rf; render(true); }
  else if(t.dataset.cc){
    const title=$('ccT').value.trim(), msg=$('ccM'); if(!title){ msg.textContent='Add a title.'; return; }
    const d={kind:$('ccK').value,title:title.slice(0,120),summary:$('ccS').value.trim().slice(0,300),body:$('ccB').value.trim().slice(0,8000),url:T.safeUrl($('ccU').value),level:Number($('ccL').value)||0,order:0,resources:[],status:t.dataset.cc,createdBy:S.uid,createdByName:S.me.name||'',createdAt:FV().serverTimestamp(),updatedAt:FV().serverTimestamp()};
    t.disabled=true;
    try{ await db.collection('techContent').add(d); ['ccT','ccS','ccB','ccU'].forEach(i=>{ $(i).value=''; }); msg.style.color='#1d8b57'; msg.textContent=t.dataset.cc==='published'?'Published ✓':'Saved as draft ✓'; }
    catch(er){ msg.style.color='#b8362a'; msg.textContent='Could not save: '+T.errMsg(er); }
    t.disabled=false;
  }
  else if(t.dataset.pub){ try{ await db.collection('techContent').doc(t.dataset.pub).update({status:t.dataset.to,updatedAt:FV().serverTimestamp()}); }catch(er){ alert(T.errMsg(er)); } }
  else if(t.id==='pSave'){
    const msg=$('pMsg'), patch={phone:$('pPh').value.trim().slice(0,40),bio:$('pBio').value.trim().slice(0,600),updatedAt:FV().serverTimestamp()};
    try{ await db.collection('techCoaches').doc(S.uid).update(patch); Object.assign(S.me,patch); msg.style.color='#1d8b57'; msg.textContent='Saved.'; }
    catch(er){ msg.style.color='#b8362a'; msg.textContent='Could not save: '+T.errMsg(er); }
  }
  else if(t.id==='pPw'){ const msg=$('pMsg'); auth.sendPasswordResetEmail(S.me.email||auth.currentUser.email).then(()=>{ msg.style.color='#1d8b57'; msg.textContent='Reset link sent to '+(S.me.email||'your email')+'.'; },er=>{ msg.style.color='#b8362a'; msg.textContent=T.errMsg(er); }); }
});
})();
</script>
</body>
</html>
