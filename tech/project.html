<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Student project | Paisley TECH</title>
<!-- Published builder projects. Shared by link, never indexed: builders are young people. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#245F5A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="icon" href="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" sizes="32x32" />
<style>
:root{--brand:#55BFB3;--brand-deep:#245F5A;--brand-soft:#7BCBC2;--paper:#F4F8F7;--surface:#fff;--sage:#E5F2EF;--ink:#1D2A28;--muted:#5A6E6A;--line:rgba(38,51,49,.1);--gold:#F5C842;--font:'Quicksand',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand-deep);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--brand-deep);font-weight:800}
.top .brand img{width:34px;height:34px;border-radius:9px}
.top .brand span{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:clamp(1.2rem,4vw,2.6rem) 16px 4rem}
.hero{background:var(--brand-deep);color:#fff;border-radius:24px;padding:clamp(1.4rem,4vw,2.4rem);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--brand);opacity:.15;right:-60px;top:-90px}
.hero .kind{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-soft)}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:.4rem 0 .6rem;position:relative}
.hero p{color:#d9f2ee;max-width:65ch;font-weight:500;position:relative}
.by{margin-top:1rem;font-weight:700;color:var(--gold);position:relative}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;position:relative}
.chip{padding:.25rem .7rem;border-radius:99px;background:rgba(255,255,255,.12);font-size:.74rem;font-weight:800}
.section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(1.1rem,3vw,1.8rem);margin-top:1.4rem}
.section h2{font-size:1.1rem;color:var(--brand-deep);margin-bottom:.8rem}
.article{font-size:1.02rem;line-height:1.75;max-width:70ch}
.article h2,.article h3,.article h4{color:var(--brand-deep);margin:1.2rem 0 .4rem;line-height:1.3}
.article p{margin:.6rem 0}.article ul,.article ol{margin:.6rem 0 .6rem 1.4rem}
.article img{max-width:100%;border-radius:12px;margin:.8rem 0}
.article blockquote{border-left:4px solid var(--brand);padding:.3rem 1rem;margin:.8rem 0;color:var(--muted)}
.run{width:100%;height:min(70vh,560px);border:1px solid var(--line);border-radius:14px;background:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.gallery a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sage)}
.gallery img{display:block;width:100%;height:220px;object-fit:cover}
.media video,.media audio{width:100%;border-radius:14px;margin-bottom:.8rem;background:#0d1a18}
pre{background:#0f1f1d;color:#d9f2ee;border-radius:12px;padding:1rem;overflow:auto;font-size:.82rem;max-height:420px}
details{margin-top:.6rem}summary{cursor:pointer;font-weight:800;color:var(--brand-deep)}
.prose{white-space:pre-wrap}
.ai{display:grid;gap:.6rem}.ai b{color:var(--brand-deep)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}.tools span{padding:.2rem .65rem;border-radius:99px;background:var(--sage);color:var(--brand-deep);font-size:.78rem;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:99px;background:var(--brand);color:#04231f;text-decoration:none;font-weight:800;font-size:.85rem;border:0;cursor:pointer;font-family:inherit}
.btn.light{background:var(--surface);border:1.5px solid var(--line);color:var(--brand-deep)}
.state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.state h1{color:var(--brand-deep);font-size:1.5rem;margin-bottom:.4rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2rem}
@media(max-width:600px){.gallery img{height:180px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/tech"><img src="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" width="34" height="34" alt="" /><div>Paisley TECH<span>Student showcase</span></div></a>
  <button class="btn light" type="button" id="copy" hidden><i class="fas fa-link"></i> Copy link</button>
</header>
<main class="wrap" id="view"><div class="state"><p>Loading project…</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/tech/writing-studio.js?v=tech7"></script>
<script src="/js/tech/code-lab.js?v=tech7"></script>
<script>
/* Public page for a published TECH project: /tech/p/{buildId} (or ?id=).
   Reads techShowcase/{buildId} only, the public copy a coach or the Studio Desk makes when
   they publish approved work (TechUI.approveShowcase). Nothing else about the builder is
   readable here; unpublished projects have no showcase doc, so they cannot be shown. */
(function(){
'use strict';
const view=document.getElementById('view');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{ u=String(u||'').trim(); return /^https:\/\//i.test(u)?u:''; };
const clean=h=>window.WritingStudio&&WritingStudio.sanitizeHtml?WritingStudio.sanitizeHtml(h):esc(String(h||'').replace(/<[^>]+>/g,' '));
const LABEL={CODE:'Code',DESIGN:'Design',WRITING:'Blog / writing',RESEARCH:'Research',MEDIA:'Media',MUSIC:'Music',AI:'AI project',BUILD:'Invention',Other:'Project'};
const ICON={CODE:'fa-code',DESIGN:'fa-palette',WRITING:'fa-pen-nib',RESEARCH:'fa-microscope',MEDIA:'fa-film',MUSIC:'fa-music',AI:'fa-robot',BUILD:'fa-rocket',Other:'fa-star'};
const parts=location.pathname.split('/').filter(Boolean);
const id=new URLSearchParams(location.search).get('id')||(parts[0]==='tech'&&parts[1]==='p'?decodeURIComponent(parts[2]||''):'');

function missing(){
  document.title='Project not available | Paisley TECH';
  view.innerHTML='<div class="state"><h1>This project isn’t published</h1><p>It may have been taken down, or the link is wrong.</p><p style="margin-top:1rem"><a class="btn" href="/tech">Discover Paisley TECH</a></p></div>';
}
function section(title,html){ return html?'<section class="section"><h2>'+title+'</h2>'+html+'</section>':''; }

function render(p){
  const cat=p.category||'Other', code=(p.codeFiles||[]).filter(f=>String(f.content||'').trim());
  const images=(p.images||[]).filter(x=>safe(x.url)), media=(p.media||[]).filter(x=>safe(x.url));
  document.title=(p.title||'Student project')+' | Paisley TECH';
  let main='';
  /* Each project type gets the presentation that suits it; mixed projects show every part they have. */
  if(code.length&&window.CodeLab&&CodeLab.buildPreview) main+=section('Try it','<iframe class="run" id="run" sandbox="allow-scripts" referrerpolicy="no-referrer" title="Live project"></iframe>');
  if(safe(p.previewUrl)) main+='<p style="margin-top:.8rem"><a class="btn" href="'+esc(safe(p.previewUrl))+'" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-up-right-from-square"></i> Open the live version</a></p>';
  if(p.writingHtml) main+=section(cat==='RESEARCH'?'The research':(cat==='WRITING'?'':'Write-up'),'<article class="article">'+clean(p.writingHtml)+'</article>');
  if(p.workText) main+=section(cat==='RESEARCH'?'Findings':'About the project','<div class="prose">'+esc(p.workText)+'</div>');
  if(images.length) main+=section(cat==='DESIGN'?'Gallery':'Images','<div class="gallery">'+images.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer"><img src="'+esc(x.url)+'" alt="'+esc(x.name||p.title||'')+'" loading="lazy"></a>').join('')+'</div>');
  if(media.length) main+=section(cat==='MUSIC'?'Listen':'Watch','<div class="media">'+media.map(x=>/audio\/|\.(mp3|wav|m4a|ogg)(\?|$)/i.test((x.type||'')+' '+(x.name||x.url))?'<audio controls preload="metadata" src="'+esc(x.url)+'"></audio>':'<video controls preload="metadata" src="'+esc(x.url)+'"></video>').join('')+'</div>');
  if(code.length) main+=section('The code',code.map(f=>'<details><summary>'+esc(f.name)+'</summary><pre>'+esc(f.content)+'</pre></details>').join(''));
  const r=p.reflection||{}, tools=(p.toolsUsed||[]).filter(t=>t&&!/^none$/i.test(t));
  const ai=(p.contribution?'<div><b>What I made myself.</b> '+esc(p.contribution)+'</div>':'')+
    (tools.length?'<div><b>AI tools used.</b><div class="tools" style="margin-top:.3rem">'+tools.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div>':'')+
    (r.purpose?'<div><b>How I used AI.</b> '+esc(r.purpose)+'</div>':'')+
    (r.learned?'<div><b>What I learned.</b> '+esc(r.learned)+'</div>':'');
  view.innerHTML='<section class="hero"><span class="kind"><i class="fas '+(ICON[cat]||ICON.Other)+'"></i> '+esc(LABEL[cat]||cat)+(p.origin==='self'?' · Self-led project':'')+'</span>'+
      '<h1>'+esc(p.title||'Student project')+'</h1>'+(p.description?'<p>'+esc(p.description)+'</p>':'')+
      '<div class="by">By '+esc(p.displayName||'a Paisley student')+'</div>'+
      ((p.disciplines||[]).length||(p.skills||[]).length?'<div class="chips">'+(p.disciplines||[]).concat(p.skills||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':'')+'</section>'+
    (main||section('The project','<p class="prose">'+esc(p.description||'')+'</p>'))+
    section('The maker’s notes','<div class="ai">'+ai+'</div>')+
    '<p class="foot">Made at <a href="/tech">Paisley TECH</a>, reviewed and approved by a Paisley coach. Only the maker’s first name is shown.</p>';
  const run=document.getElementById('run');
  if(run) run.srcdoc=CodeLab.buildPreview(code,p.codeActive);
  const cb=document.getElementById('copy'); cb.hidden=false;
  cb.onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>{ cb.innerHTML='<i class="fas fa-check"></i> Copied'; },()=>prompt('Copy this link',location.href)); };
}

if(!id||id.indexOf('/')!==-1) missing();
else db.collection('techShowcase').doc(id).get().then(s=>{ if(s.exists) render(s.data()); else missing(); }).catch(missing);
})();
</script>
</body>
</html>
