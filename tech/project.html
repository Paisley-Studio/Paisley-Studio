<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Student project | Paisley Tech Studio</title>
<!-- Published builder projects. Shared by link, never indexed: builders are young people. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#245F5A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="icon" href="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" sizes="32x32" />
<style>
:root{--brand:#55BFB3;--brand-deep:#245F5A;--brand-soft:#7BCBC2;--paper:#F4F8F7;--surface:#fff;--sage:#E5F2EF;--ink:#1D2A28;--muted:#5A6E6A;--line:rgba(38,51,49,.1);--gold:#F5C842;--font:'Quicksand',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand-deep);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(16px,4vw,40px);background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--brand-deep);font-weight:800}
.top .brand img{width:34px;height:34px;border-radius:9px}
.top .brand span{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:980px;margin:0 auto;padding:clamp(1.2rem,4vw,2.6rem) 16px 4rem}
.hero{background:var(--brand-deep);color:#fff;border-radius:24px;padding:clamp(1.4rem,4vw,2.4rem);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--brand);opacity:.15;right:-60px;top:-90px}
.hero .kind{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-soft)}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:.4rem 0 .6rem;position:relative}
.hero p{color:#d9f2ee;max-width:65ch;font-weight:500;position:relative}
.by{margin-top:1rem;font-weight:700;color:var(--gold);position:relative}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;position:relative}
.chip{padding:.25rem .7rem;border-radius:99px;background:rgba(255,255,255,.12);font-size:.74rem;font-weight:800}
.section{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(1.1rem,3vw,1.8rem);margin-top:1.4rem}
.section h2{font-size:1.1rem;color:var(--brand-deep);margin-bottom:.8rem}
.article{font-size:1.02rem;line-height:1.75;max-width:70ch}
.article h2,.article h3,.article h4{color:var(--brand-deep);margin:1.2rem 0 .4rem;line-height:1.3}
.article p{margin:.6rem 0}.article ul,.article ol{margin:.6rem 0 .6rem 1.4rem}
.article img{max-width:100%;border-radius:12px;margin:.8rem 0}
.article blockquote{border-left:4px solid var(--brand);padding:.3rem 1rem;margin:.8rem 0;color:var(--muted)}
.site{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 18px 44px rgba(15,26,20,.1)}
.site-bar{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;background:var(--sage);border-bottom:1px solid var(--line)}
.site-dots{display:flex;gap:.3rem}.site-dots i{width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid rgba(36,95,90,.25)}
.site-url{flex:1;min-width:0;display:flex;align-items:center;gap:.45rem;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.3rem .8rem;font-size:.8rem;font-weight:700;color:var(--brand-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-url i{color:var(--brand);font-size:.75rem}
.site-btn{flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--brand-deep);cursor:pointer;display:grid;place-items:center;font-size:.85rem}
.site-btn:hover{border-color:var(--brand)}
.run{display:block;width:100%;height:min(78vh,720px);border:0;background:#fff}
.site:fullscreen{border-radius:0;display:flex;flex-direction:column}.site:fullscreen .run{flex:1;height:auto}
.player{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0f1f1d;box-shadow:0 18px 44px rgba(15,26,20,.12)}
.player-top{display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;background:var(--brand-deep);color:#fff}
.player-top .pt{flex:1;min-width:0}.player-top b{display:block;font-size:1rem}.player-top small{color:#bfe6df;font-weight:600;font-size:.8rem}
.play{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:99px;border:0;background:var(--gold);color:#2a2000;font:800 .95rem var(--font);cursor:pointer;transition:transform .15s}
.play:hover{transform:scale(1.04)}.play.stop{background:#fff;color:var(--brand-deep)}
.screen{min-height:220px;max-height:480px;overflow:auto;padding:1rem 1.1rem;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#e6f5f2;white-space:pre-wrap;word-break:break-word}
.screen .err{color:#ffb4a8}.screen .echo{color:var(--gold)}
.screen .sys{display:flex;gap:.5rem;align-items:center;font-family:var(--font);font-weight:700;font-size:.85rem;color:#9fd9d1;margin:.3rem 0}
.screen .sys.ok{color:#8fe3b0}.screen .sys.bad{color:#ffb4a8}.screen .sys.ask{color:var(--gold)}
.screen .idle{font-family:var(--font);color:#9fd9d1;font-weight:600;text-align:center;padding:3rem 1rem}
.screen .idle i{display:block;font-size:2rem;color:var(--gold);margin-bottom:.6rem}
.answer{display:flex;gap:.5rem;padding:.7rem 1.1rem;border-top:1px solid rgba(255,255,255,.1);background:#13302c}
.answer input{flex:1;min-width:0;padding:.6rem .8rem;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0f1f1d;color:#fff;font:600 .9rem var(--font)}
.answer input:focus{outline:2px solid var(--brand);outline-offset:1px}
.learn{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1.4rem;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:18px;padding:1.1rem 1.3rem}
.learn .li{width:44px;height:44px;border-radius:14px;background:var(--sage);color:var(--brand-deep);display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}
.learn .lt{flex:1;min-width:220px}.learn b{display:block;color:var(--brand-deep);font-size:1rem}.learn span{color:var(--muted);font-size:.88rem;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.gallery a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sage)}
.gallery img{display:block;width:100%;height:220px;object-fit:cover}
.media video,.media audio{width:100%;border-radius:14px;margin-bottom:.8rem;background:#0d1a18}
pre{background:#0f1f1d;color:#d9f2ee;border-radius:12px;padding:1rem;overflow:auto;font-size:.82rem;max-height:420px}
details{margin-top:.6rem}summary{cursor:pointer;font-weight:800;color:var(--brand-deep)}
.prose{white-space:pre-wrap}
.ai{display:grid;gap:.6rem}.ai b{color:var(--brand-deep)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}.tools span{padding:.2rem .65rem;border-radius:99px;background:var(--sage);color:var(--brand-deep);font-size:.78rem;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:99px;background:var(--brand);color:#04231f;text-decoration:none;font-weight:800;font-size:.85rem;border:0;cursor:pointer;font-family:inherit}
.btn.light{background:var(--surface);border:1.5px solid var(--line);color:var(--brand-deep)}
.state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.state h1{color:var(--brand-deep);font-size:1.5rem;margin-bottom:.4rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2rem}
.hint{margin:-.2rem 0 .8rem;color:var(--muted);font-size:.9rem;font-weight:600}.hint i{color:#00B4F0}
@media(max-width:600px){.gallery img{height:180px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/tech"><img src="https://aws-filez.s3.eu-north-1.amazonaws.com/cropped-Paisely-logo-Resized.png" width="34" height="34" alt="" /><div>Paisley Tech Studio<span>Student showcase</span></div></a>
  <button class="btn light" type="button" id="copy" hidden><i class="fas fa-link"></i> Copy link</button>
</header>
<main class="wrap" id="view"><div class="state"><p>Loading project…</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/tech/writing-studio.js?v=tech13"></script>
<script src="/js/tech/code-lab.js?v=tech23"></script>
<script>
/* Public page for a published Tech Studio project: /tech/p/{buildId} (or ?id=).
   Reads techShowcase/{buildId} only, the public copy a coach or the Studio Desk makes when
   they publish approved work (TechUI.approveShowcase). Nothing else about the builder is
   readable here; unpublished projects have no showcase doc, so they cannot be shown. */
(function(){
'use strict';
const view=document.getElementById('view');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{ u=String(u||'').trim(); return /^https:\/\//i.test(u)?u:''; };
const clean=h=>window.WritingStudio&&WritingStudio.sanitizeHtml?WritingStudio.sanitizeHtml(h):esc(String(h||'').replace(/<[^>]+>/g,' '));
const LABEL={CODE:'Code',DESIGN:'Design',WRITING:'Blog / writing',RESEARCH:'Research',MEDIA:'Media',MUSIC:'Music',AI:'AI project',BUILD:'Invention',Other:'Project'};
const ICON={CODE:'fa-code',DESIGN:'fa-palette',WRITING:'fa-pen-nib',RESEARCH:'fa-microscope',MEDIA:'fa-film',MUSIC:'fa-music',AI:'fa-robot',BUILD:'fa-rocket',Other:'fa-star'};
const parts=location.pathname.split('/').filter(Boolean);
const id=new URLSearchParams(location.search).get('id')||(parts[0]==='tech'&&parts[1]==='p'?decodeURIComponent(parts[2]||''):'');

function missing(){
  document.title='Project not available | Paisley Tech Studio';
  view.innerHTML='<div class="state"><h1>This project isn’t published</h1><p>It may have been taken down, or the link is wrong.</p><p style="margin-top:1rem"><a class="btn" href="/tech">Discover Paisley Tech Studio</a></p></div>';
}
function section(title,html){ return html?'<section class="section"><h2>'+title+'</h2>'+html+'</section>':''; }

/* One Run button and the output: the same sandboxed runner as Paisley VS Code (CodeLab.loadRuntime).
   This page cannot pause a program while it waits for typing, so when it asks for something the
   visitor answers in the box and it runs again with every answer so far, with the same random seed. */
function player(files,progs,assets){
  const screen=document.getElementById('screen'), play=document.getElementById('play'), form=document.getElementById('answer'), ans=document.getElementById('ans');
  const entry=progs.find(f=>/^main\./i.test(f.name.split('/').pop()))||progs[0];
  const key=(CodeLab.LANGS[entry.lang]||{}).run;
  let R=null, answers=[], seed=0, tok=0, running=false;
  const put=(t,cls)=>{ const i=screen.querySelector('.idle'); if(i) screen.innerHTML=''; const last=screen.lastChild;
    if(last&&last.nodeType===1&&last.tagName==='SPAN'&&last.className===(cls||'out')) last.textContent+=t; else { const s=document.createElement('span'); s.className=cls||'out'; s.textContent=t; screen.appendChild(s); }
    screen.scrollTop=screen.scrollHeight; };
  const sys=(kind,icon,text)=>{ const i=screen.querySelector('.idle'); if(i) screen.innerHTML=''; const d=document.createElement('div'); d.className='sys '+(kind||''); d.innerHTML='<i class="fas '+icon+'"></i><span></span>'; d.lastChild.textContent=text; screen.appendChild(d); screen.scrollTop=screen.scrollHeight; };
  const setRun=on=>{ running=on; play.classList.toggle('stop',on); play.innerHTML=on?'<i class="fas fa-stop"></i> Stop':'<i class="fas fa-play"></i> '+(screen.querySelector('.idle')?'Run':'Run again'); };
  function go(again){
    tok++; const t=tok, javaOut=[]; let starved=false;
    if(running&&R){ try{ R.stop(); }catch(e){} }
    if(!again){ answers=[]; seed=Date.now(); }
    form.hidden=true; screen.innerHTML=''; setRun(true);
    CodeLab.loadRuntime().then(r=>{ R=r; if(t!==tok) return;
      if(key!=='java'&&R.state(key==='c'?'cpp':key)!=='ready'&&!again) sys('','fa-cloud-arrow-down','Getting ready. The first run takes a little while, then it is quick.');
      return (key==='java'?Promise.resolve([]):CodeLab.binaryFiles(assets)).then(bins=>{ if(t!==tok) return;
        return R.run({lang:key,files:files.map(f=>({name:f.name,content:f.content})).concat(bins),entry:entry.name,stdin:answers.length?answers.join('\n')+'\n':'',live:false,seed:seed},{
          out:(s,x)=>{ if(t!==tok||starved) return; if(key==='java'){ javaOut.push([s,x]); return; } put(x,s==='stderr'?'err':'out'); },
          echo:x=>{ if(t===tok&&!starved) put(x+'\n','echo'); },
          starved:()=>{ starved=true; },
          phase:ph=>{ if(t===tok&&ph==='compile') sys('','fa-gears','Getting it ready…'); }
        }).then(res=>{ if(t!==tok) return; res=res||{};
          if(key==='java'){ const all=javaOut.map(x=>x[1]).join(''); if(/NoSuchElementException/.test(all)) starved=true; javaOut.forEach(x=>{ if(!(starved&&x[0]==='stderr')) put(x[1],x[0]==='stderr'?'err':'out'); }); }
          setRun(false);
          if(res.stopped) return sys('bad','fa-stop','Stopped.');
          if(starved&&!res.failed&&res.phase!=='compile'){ sys('ask','fa-keyboard','It is asking you something. Type your answer below and press Enter.'); form.hidden=false; ans.value=''; ans.focus(); return; }
          if(key==='java'&&(res.failed||res.notConfigured)) return sys('bad','fa-cloud','This Java program can only run inside Paisley Tech Studio for now. Ask the maker to show it to you.');
          if(res.failed) return sys('bad','fa-triangle-exclamation','It could not start. Check your internet connection and press Run again.');
          if(res.phase==='compile') return sys('bad','fa-circle-xmark','This version does not run yet. The maker is still working on it.');
          if(res.ok&&!res.code) sys('ok','fa-circle-check','Finished.'); else sys('bad','fa-circle-xmark','The program stopped early.');
        });
      });
    }).catch(()=>{ if(t!==tok) return; setRun(false); sys('bad','fa-triangle-exclamation','It could not start. Check your internet connection and press Run again.'); });
  }
  play.onclick=()=>{ if(running){ tok++; try{ R&&R.stop(); }catch(e){} setRun(false); sys('bad','fa-stop','Stopped.'); form.hidden=true; } else go(false); };
  form.onsubmit=e=>{ e.preventDefault(); answers.push(String(ans.value).slice(0,2000)); go(true); };
}

function render(p){
  const cat=p.category||'Other', code=(p.codeFiles||[]).filter(f=>String(f.content||'').trim());
  const images=(p.images||[]).filter(x=>safe(x.url)), media=(p.media||[]).filter(x=>safe(x.url));
  document.title=(p.title||'Student project')+' | Paisley Tech Studio';
  let main='';
  /* Each project type gets the presentation that suits it; mixed projects show every part they have. */
  /* Families see what was built, never the code. A website shows as a live site in a browser frame
     with this page's link as its address; a program (Python, Java, C, C++, PHP) gets one big Run button
     and its output, run here sealed in a sandbox. */
  const withLang=code.map(f=>({name:f.name,lang:f.lang||(window.CodeLab?CodeLab.langOf(f.name):''),content:f.content}));
  const progs=window.CodeLab&&CodeLab.isProgram?withLang.filter(f=>CodeLab.isProgram(f)):[];
  const web=withLang.some(f=>f.lang==='html');
  const who=esc(p.displayName||'the maker');
  if(web&&window.CodeLab&&CodeLab.buildPreview) main+='<section class="section"><h2>See it live</h2><div class="site" id="site"><div class="site-bar"><span class="site-dots"><i></i><i></i><i></i></span>'+
      '<span class="site-url"><i class="fas fa-lock"></i>'+esc(location.host+location.pathname)+'</span>'+
      '<button class="site-btn" type="button" id="reload" title="Start again" aria-label="Start again"><i class="fas fa-rotate-right"></i></button>'+
      '<button class="site-btn" type="button" id="full" title="Full screen" aria-label="Full screen"><i class="fas fa-expand"></i></button></div>'+
      '<iframe class="run" id="run" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer" title="'+esc(p.title||'Live project')+'"></iframe></div></section>';
  if(progs.length) main+='<section class="section"><h2>'+(web?'Run the program':'Try it')+'</h2><div class="player" id="player"><div class="player-top"><div class="pt"><b>'+who+'’s program</b><small>Press Run to start it. If it asks you something, type your answer and press Enter.</small></div>'+
      '<button class="play" type="button" id="play"><i class="fas fa-play"></i> Run</button></div>'+
      '<div class="screen" id="screen" aria-live="polite"><div class="idle"><i class="fas fa-circle-play"></i>Press Run to see it work.</div></div>'+
      '<form class="answer" id="answer" hidden><input type="text" id="ans" autocomplete="off" aria-label="Your answer" placeholder="Type your answer, then press Enter"><button class="btn" type="submit"><i class="fas fa-arrow-turn-down fa-rotate-90"></i> Send</button></form></div></section>';
  if(safe(p.previewUrl)) main+='<p style="margin-top:.8rem"><a class="btn" href="'+esc(safe(p.previewUrl))+'" target="_blank" rel="noopener noreferrer"><i class="fas fa-arrow-up-right-from-square"></i> Open the live version</a></p>';
  if(p.writingHtml) main+=section(cat==='RESEARCH'?'The research':(cat==='WRITING'?'':'Write-up'),'<article class="article">'+clean(p.writingHtml)+'</article>');
  if(p.workText) main+=section(cat==='RESEARCH'?'Findings':'About the project','<div class="prose">'+esc(p.workText)+'</div>');
  if(images.length) main+=section(cat==='DESIGN'?'Gallery':'Images','<div class="gallery">'+images.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer"><img src="'+esc(x.url)+'" alt="'+esc(x.name||p.title||'')+'" loading="lazy"></a>').join('')+'</div>');
  if(media.length) main+=section(cat==='MUSIC'?'Listen':'Watch','<div class="media">'+media.map(x=>/audio\/|\.(mp3|wav|m4a|ogg)(\?|$)/i.test((x.type||'')+' '+(x.name||x.url))?'<audio controls preload="metadata" src="'+esc(x.url)+'"></audio>':'<video controls preload="metadata" src="'+esc(x.url)+'"></video>').join('')+'</div>');
  const r=p.reflection||{}, tools=(p.toolsUsed||[]).filter(t=>t&&!/^none$/i.test(t));
  const ai=(p.contribution?'<div><b>What I made myself.</b> '+esc(p.contribution)+'</div>':'')+
    (tools.length?'<div><b>AI tools used.</b><div class="tools" style="margin-top:.3rem">'+tools.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div>':'')+
    (r.purpose?'<div><b>How I used AI.</b> '+esc(r.purpose)+'</div>':'')+
    (r.learned?'<div><b>What I learned.</b> '+esc(r.learned)+'</div>':'');
  view.innerHTML='<section class="hero"><span class="kind"><i class="fas '+(ICON[cat]||ICON.Other)+'"></i> '+esc(LABEL[cat]||cat)+(p.language?' · '+esc(p.language):'')+(p.origin==='self'?' · Self-led project':(p.origin==='class'?' · Class work':(p.origin==='practice'?' · Practice lab':'')))+'</span>'+
      '<h1>'+esc(p.title||'Student project')+'</h1>'+(p.description?'<p>'+esc(p.description)+'</p>':'')+
      '<div class="by">By '+esc(p.displayName||'a Paisley student')+'</div>'+
      ((p.disciplines||[]).length||(p.skills||[]).length?'<div class="chips">'+(p.disciplines||[]).concat(p.skills||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':'')+'</section>'+
    (main||section('The project','<p class="prose">'+esc(p.description||'')+'</p>'))+
    section('The maker’s notes','<div class="ai">'+ai+'</div>')+
    '<aside class="learn"><span class="li"><i class="fas fa-graduation-cap"></i></span><div class="lt"><b>Your child can build this too.</b><span>'+who+' learned to make this at Paisley Tech Studio: coding, websites, apps and games, with real coaches.</span></div>'+
      '<a class="btn" href="https://paisleystudio.online/tech" target="_blank" rel="noopener">Learn this at Paisley <i class="fas fa-arrow-right"></i></a></aside>'+
    '<p class="foot">Made at <a href="/tech">Paisley Tech Studio</a>, reviewed and approved by a Paisley coach. Only the maker’s first name is shown.</p>';
  const run=document.getElementById('run'), assets=(p.codeAssets||[]).filter(a=>safe(a.url));
  if(run){
    const show=()=>{ run.srcdoc=CodeLab.buildPreview(withLang,p.codeActive,assets); };
    show();
    document.getElementById('reload').onclick=show;
    const site=document.getElementById('site'), full=document.getElementById('full');
    if(!site.requestFullscreen) full.hidden=true;
    full.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else site.requestFullscreen().catch(()=>{}); };
    document.addEventListener('fullscreenchange',()=>{ full.innerHTML='<i class="fas '+(document.fullscreenElement?'fa-compress':'fa-expand')+'"></i>'; });
  }
  if(progs.length) player(withLang,progs,assets);
  const cb=document.getElementById('copy'); cb.hidden=false;
  cb.onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>{ cb.innerHTML='<i class="fas fa-check"></i> Copied'; },()=>prompt('Copy this link',location.href)); };
}

if(!id||id.indexOf('/')!==-1) missing();
else db.collection('techShowcase').doc(id).get().then(s=>{ if(s.exists) render(s.data()); else missing(); }).catch(missing);
})();
</script>
<script src="/js/ui/site-status.js?v=2" defer></script>
</body>
</html>
